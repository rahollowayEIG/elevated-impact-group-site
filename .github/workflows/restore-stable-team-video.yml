name: Restore stable homepage team video

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/restore-stable-team-video.yml"

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore original stable video
        run: |
          git show ab001e71082b6e6b7e965666748e62c57272202f:assets/eig-team-clean-walk.mp4 > assets/eig-team-clean-walk.mp4

      - name: Commit restored video and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/eig-team-clean-walk.mp4
          git rm .github/workflows/restore-stable-team-video.yml
          git commit -m "Restore stable homepage team video for launch"
          git push
